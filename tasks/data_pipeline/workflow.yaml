main:
  params: [args]
  steps:
    - extract_opa_properties:
        call: http.get
        args:
          url: ${"https://" + sys.get_env("GOOGLE_CLOUD_REGION") + "-" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + ".cloudfunctions.net/extract-opa-properties"}
          auth:
            type: OIDC
    - prepare_opa_properties:
        call: http.get
        args:
          url: ${"https://" + sys.get_env("GOOGLE_CLOUD_REGION") + "-" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + ".cloudfunctions.net/prepare-opa-properties"}
          auth:
            type: OIDC
    - load_opa_properties_source:
        call: http.get
        args:
          url: ${"https://" + sys.get_env("GOOGLE_CLOUD_REGION") + "-" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + ".cloudfunctions.net/load-opa-properties"}
          query:
            sql: source/opa_properties.sql
          auth:
            type: OIDC
    - load_opa_properties_core:
        call: http.get
        args:
          url: ${"https://" + sys.get_env("GOOGLE_CLOUD_REGION") + "-" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + ".cloudfunctions.net/load-opa-properties"}
          query:
            sql: core/opa_properties.sql
          auth:
            type: OIDC
